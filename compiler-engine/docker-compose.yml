version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  api-server:
    build: .
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=5000
    depends_on:
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Allows container-in-container docker commands
      - ./temp:/home/runner/temp

  worker:
    build: .
    command: npm run worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./temp:/home/runner/temp

networks:
  default:
    name: compiler-network
